name: Grid Intelligence offline tests

on:
  push:
    paths:
      - "experiments/**"
      - "tests/**"
      - ".github/workflows/grid-intelligence-tests.yml"
  pull_request:
    paths:
      - "experiments/**"
      - "tests/**"
      - ".github/workflows/grid-intelligence-tests.yml"

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install extractor dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Run offline test suite
        run: python -m unittest discover -s tests -v
